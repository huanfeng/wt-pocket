name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            read -r status conclusion < <(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1               --json status,conclusion -q '.[0] | "\(.status // "none") \(.conclusion // "none")"' || echo "none none")
            echo "CI status=$status conclusion=$conclusion"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] && exit 0
              echo "CI did not succeed for $GITHUB_SHA" >&2; exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for CI on $GITHUB_SHA" >&2; exit 1

  package:
    needs: gate
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-docs
          rustup default stable
      - name: Build and test
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust clippy failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          ./scripts/Build.ps1
          foreach ($test in @('Smoke', 'Module', 'Startup', 'Backend.Migration')) {
            & pwsh -NoLogo -NoProfile -File "tests/$test.Tests.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test tests failed" }
          }
      - name: Package native release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_RUNTIME: ${{ matrix.runtime }}
        run: ./scripts/Package.ps1 -Version $env:RELEASE_TAG -Runtime $env:PACKAGE_RUNTIME
      - name: Test offline installation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_RUNTIME: ${{ matrix.runtime }}
        run: ./tests/Install.Release.Tests.ps1 -ArchivePath "./artifacts/release/$env:RELEASE_TAG/wtpocket-$env:RELEASE_TAG-$env:PACKAGE_RUNTIME.zip" -ChecksumPath "./artifacts/release/$env:RELEASE_TAG/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.runtime }}
          path: artifacts/release/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum wtpocket-*.zip > SHA256SUMS)
          args=("$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "WTPocket $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
